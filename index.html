<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="TalentInbound is a reverse hiring platform where verified companies search for candidates and opportunities come directly to them."
    />
    <meta name="theme-color" content="#365f7d" />
    <meta property="og:title" content="TalentInbound | Let the right recruiters find you" />
    <meta
      property="og:description"
      content="Create one professional profile, stay discoverable, and let verified recruiters bring relevant opportunities to you."
    />
    <meta property="og:type" content="website" />
    <title>TalentInbound | Reverse Hiring Platform</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('talent-inbound-theme')
        const theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
